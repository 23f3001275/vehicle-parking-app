<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" href="../../static/css/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <title> {% block title %} {% endblock %} </title>
    </head>

    <body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
{% if login_success %}
    <a class="navbar-brand">Welcome, {{ admin_name }}</a>
      <div class="collapse navbar-collapse " id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 mx-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{{url_for('homeAdmin', admin_name=admin_name, login_success=login_success)}}">Home</a>
          </li>

          <li class="nav-item">
          <a class="nav-link"> | </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{{ url_for('allUsers',admin_name=admin_name, login_success=login_success)}}">Users</a>
          </li>

          <li class="nav-item">
          <a class="nav-link"> | </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{{url_for('summaryAdmin', admin_name=admin_name, login_success=login_success)}}">Summary</a>
          </li>

          <li class="nav-item">
          <a class="nav-link"> | </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/">Logout</a>
          </li>

        </ul>
      </div>
    </div>

      {% else %}
  <h3 class="mx-auto"> VPL </h3>
     {% endif %}
</nav>

        {% block body %} {% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    </body>
</html>
