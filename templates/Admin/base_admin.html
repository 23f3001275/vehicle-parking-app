<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    {% if login_success %}
      <!-- Left: Welcome message -->
      <a class="navbar-brand">Welcome, {{ admin_name }}</a>
      
      <!-- Center: Navigation links -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('homeAdmin', admin_name=admin_name, login_success=login_success) }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link separator">|</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('allUsers', admin_name=admin_name, login_success=login_success) }}">Users</a>
          </li>
          <li class="nav-item">
            <a class="nav-link separator">|</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('summaryAdmin', admin_name=admin_name, login_success=login_success) }}">Summary</a>
          </li>
        </ul>
      </div>
      
      <!-- Right: Edit Profile and Logout -->
      <div class="navbar-right">
        <a href="/" class="btn btn-outline-danger btn-sm">Logout</a>
      </div>
      
    {% else %}
      <h3 class="mx-auto">VPL</h3>
    {% endif %}
  </div>
</nav>

{% block body %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
