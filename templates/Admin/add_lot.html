{% extends "./Admin/base_admin.html" %}


{% block title %} Add Lots {% endblock %}


{% block body %}
<div class="main-form-container">
    <div class="page-header admin-summary-header">
        <h2 class="main-form-title">Add a Lot</h2>
    </div>
    <form action="{{ url_for('addLotAdmin', admin_name=admin_name, login_success=login_success) }}" method="POST" class="main-form">
        <div class="form-group">
            <label for="location_name" class="form-label">Location Name</label>
            <input type="text" id="location_name" name="location_name" class="form-control">
        </div>

        <div class="form-group">
            <label for="price" class="form-label">Price (per spot per hour)</label>
            <input type="number" id="price" name="price" class="form-control">
        </div>

        <div class="form-group">
            <label for="max_spots" class="form-label">Maximum Spots</label>
            <input type="number" id="max_spots" name="max_spots" class="form-control">
        </div>

        <div class="form-group">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" name="address" class="form-control">
        </div>

        <div class="form-group">
            <label for="pincode" class="form-label">Pincode</label>
            <input type="number" id="pincode" name="pincode" class="form-control">
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-warning form-button">Add</button>
        </div>
        
    </form>
</div>

{% endblock %}
