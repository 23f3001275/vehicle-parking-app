{% extends "./Admin/base_admin.html" %}


{% block title %} Add Lots {% endblock %}


{% block body %}
<div class="mx-auto p-5 m-5 form-container" style="max-width:600px; text-align:center;">
    <h2 style="color:rgb(0, 0, 0);"> Add a Lot</h2>
    <form action="{{url_for('addLotAdmin', admin_name=admin_name, login_success=login_success)}}" method="POST">

        <div class="login">
            <h7> Location Name </h7>
            <input type="name" class="form-control" name="location_name"><br>
        </div>

        <div class="login">
            <h7> Price (per spot per hour) </h7>
            <input type="number" class="form-control" name="price"><br>
        </div>

        <div class="login">
            <h7> Maximum Spots </h7>
            <input type="number" class="form-control" name="max_spots"><br>
        </div>

        <div class="login">
            <h7> Address </h7>
            <input type="address" class="form-control" name="address"><br>
        </div>

        <div class="login">
            <h7> Pincode </h7>
            <input type="number" class="form-control" name="pincode"><br>
        </div>

        <button type="submit" class="btn btn-warning" style="padding:5px; width:100px;background-color: aqua; margin:10px;"> Add </button><br>
    </form>
</div>
{% endblock %}
