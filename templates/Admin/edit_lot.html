{% extends "./Admin/base_admin.html" %}

{% block title %} Edit Lot {% endblock %}

{% block body %}
<div class="mx-auto p-5 m-5 form-container" style="max-width:800px; text-align:center;">
    <h2 style="color:rgba(0, 0, 0, 0.6);"> Update Parking Lot Details </h2>
    
    <form action="{{ url_for('editLot', admin_name=admin_name, login_success=login_success, lot_id=lot.id) }}" method="POST">
        <div class="register">
            <h7> Location Name </h7>
            <input type="text" class="form-control" name="loc_name" value="{{ lot.prime_loc_name }}"><br>
        </div>

        <div class="register">
            <h7> Price (per spot per hour) </h7>
            <input type="number" class="form-control" name="price" step="0.01" value="{{ lot.price }}"><br>
        </div>

        <div class="register">
            <h7> Max Spots </h7>
            <input type="number" class="form-control" name="max_spots" value="{{ lot.max_spots }}"><br>
        </div>

        <div class="register">
            <h7> Address </h7>
            <input type="text" class="form-control" name="address" value="{{ lot.address }}"><br>
        </div>

        <div class="register">
            <h7> Pincode </h7>
            <input type="number" class="form-control" name="pincode" value="{{ lot.pincode }}"><br>
        </div>

        <button type="submit" class="btn btn-warning" style="padding:5px; width:200px; background-color: aqua; margin:10px;"> Save Changes </button><br>
    </form>
</div>
{% endblock %}
