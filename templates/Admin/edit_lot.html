{% extends "./Admin/base_admin.html" %}

{% block title %} Edit Lot {% endblock %}

{% block body %}
<div class="main-form-container">
    <div class="page-header admin-summary-header">
        <h2 class="main-form-title">Update Parking Lot Details</h2>
    </div>
    
    <form action="{{ url_for('editLot', admin_name=admin_name, login_success=login_success, lot_id=lot.id) }}" method="POST" class="main-form">
        
        <div class="form-group">
            <label for="loc_name" class="form-label">Location Name</label>
            <input type="text" id="loc_name" class="form-control" name="loc_name" value="{{ lot.prime_loc_name }}">
        </div>

        <div class="form-group">
            <label for="price" class="form-label">Price (per spot per hour)</label>
            <input type="number" id="price" class="form-control" name="price" step="0.01" value="{{ lot.price }}">
        </div>

        <div class="form-group">
            <label for="max_spots" class="form-label">Max Spots</label>
            <input type="number" id="max_spots" class="form-control" name="max_spots" value="{{ lot.max_spots }}">
        </div>

        <div class="form-group">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" class="form-control" name="address" value="{{ lot.address }}">
        </div>

        <div class="form-group">
            <label for="pincode" class="form-label">Pincode</label>
            <input type="number" id="pincode" class="form-control" name="pincode" value="{{ lot.pincode }}">
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-warning form-button">Save Changes</button>
        </div>

    </form>
</div>

{% endblock %}
