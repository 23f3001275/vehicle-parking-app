{% extends "./Admin/base_admin.html" %}


{% block title %} Login page {% endblock %}


{% block body %}
<div class="border border-black mx-auto p-5 m-5" style="max-width:600px; text-align:center;">
    <h2 style="color:rgb(0, 0, 0);">Login</h2>
    <form action="/login_admin" method="POST">
        <!-- <div class="login">
            <h7> Email ID </h7>
            <input type="email" name="email"><br>
        </div> -->

        {% if login_success1 %}
        <div class="alert alert-danger" role="alert"> Admin not found </div>
        {% endif %}

        <div class="login">
            <h7> Username </h7>
            <input type="name" class="form-control" name="user_name"><br>
        </div>

        <div class="login">
            <h7> Password </h7>
            <input type="password" class="form-control" name="pass_word"><br>
        </div>

        <button type="submit" style="padding:5px; width:100px;background-color: aqua; margin:10px;">Login</button><br>
    </form>
</div>
{% endblock %}
