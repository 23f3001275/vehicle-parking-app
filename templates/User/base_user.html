<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    {% if login_success %}
      <!-- Left: Welcome message -->
      <a class="navbar-brand">Welcome, {{ user_name }}</a>
      
      <!-- Center: Navigation links -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('homeUser', user_name=user_name, login_success=login_success) }}">Home</a>          </li>
          <li class="nav-item">
            <a class="nav-link separator">|</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('searchParking', user_name=user_name, login_success=login_success) }}">Search</a>
          </li>
          <li class="nav-item">
            <a class="nav-link separator">|</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('summaryUser', user_name=user_name, login_success=login_success) }}">Summary</a>
          </li>
        </ul>
      </div>
      
      <!-- Right: Edit Profile and Logout -->
      <div class="navbar-right">
        <a href="{{ url_for('editProfileUser', user_name=user_name, login_success=login_success) }}" class="btn btn-outline-primary btn-sm me-2">Edit Profile</a>
        <a href="/" class="btn btn-outline-danger btn-sm">Logout</a>
      </div>
      
    {% else %}
      <h3 class="mx-auto">VPL</h3>
    {% endif %}
  </div>
</nav>

{% block body %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
