{% extends "./User/base_user.html" %}


{% block title %} Login page {% endblock %}


{% block body %}
<div class="border border-black mx-auto p-5 m-5" style="max-width:800px; text-align:center;">
    <h2 style="color:rgba(0, 0, 0, 0.203);"> Update Details</h2>
    <form action="{{url_for('updateProfileUser', user_name=user_name, login_success=login_success)}}" method="POST">
<div class="register">
            <h7> Email ID </h7>
            <input type="email" class="form-control" name="email" value="{{user.email}}"><br>
        </div>

        <div class="register">
            <h7> Username </h7>
            <input type="name" class="form-control" name="username" value="{{user.username}}"><br>
        </div>

        <div class="register">
            <h7> Password </h7>
            <input type="password" class="form-control" name="password" value="{{user.password}}"><br>
        </div>

        <div class="register">
            <h7> Fullname </h7>
            <input type="name" class="form-control" name="fullname" value="{{user.fullname}}"><br>
        </div>

        <div class="register">
            <h7> Address </h7>
            <input type="address" class="form-control" name="address" value="{{user.address}}"><br>
        </div>

        <div class="register">
            <h7> Pincode </h7>
            <input type="number" class="form-control" name="pincode" value="{{user.pincode}}"><br>
        </div>

        <button type="submit" style="padding:5px; width:200px;background-color: aqua; margin:10px;"> Save Changes </button><br>
    </form>
</div>
{% endblock %}
