{% extends "./User/base_user.html" %}

{% block title %} Register page {% endblock %}

{% block body %}
<div class="auth-form-container mx-auto p-5">
    {% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-danger fade-out" role="alert">
      {{ messages[0] }}
    </div>
  {% endif %}
{% endwith %}
    <form action="/register_user" method="POST" class="auth-form">

                    <div class="page-header admin-summary-header">
        <h2 class="title">Register</h2>
    </div>

        <div class="form-group">
            <label for="email" class="form-label">Email ID</label>
            <input type="email" id="email" class="form-control" name="email">
        </div>

        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" name="username">
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" name="password">
        </div>

        <div class="form-group">
            <label for="fullname" class="form-label">Full Name</label>
            <input type="text" id="fullname" class="form-control" name="fullname">
        </div>

        <div class="form-group">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" class="form-control" name="address">
        </div>

        <div class="form-group">
            <label for="pincode" class="form-label">Pincode</label>
            <input type="number" id="pincode" class="form-control" name="pincode">
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary form-button">Register</button><br>
           <a href="/login_user" class="form-link">Login here!</a>
        </div>
       
    </form>
</div>
{% endblock %}
